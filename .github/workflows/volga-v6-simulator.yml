name: Volga V6 raw control

on:
  workflow_dispatch:
  push:
    branches:
      - test/volga-v6-raw-control
    paths:
      - 'main.go'
      - 'transport/yandex/volga_v6_reliable.go'
      - 'transport/yandex/volga_v6_reliable_test.go'
      - 'transport/yandex/volga_v6_carrier_manager.go'
      - 'transport/yandex/volga_v6_carrier_manager_test.go'
      - 'transport/yandex/volga_v6_recovery.go'
      - 'transport/yandex/volga_v6_recovery_test.go'
      - 'transport/yandex/volga_v6_wire.go'
      - 'transport/yandex/volga_v6_wire_test.go'
      - 'transport/yandex/volga_v6_runtime.go'
      - 'transport/yandex/volga_v6_runtime_test.go'
      - 'transport/yandex/volga_v6_yandex_carrier.go'
      - 'transport/yandex/volga_v6_yandex_carrier_test.go'
      - 'transport/yandex/volga_v6_yandex_health.go'
      - 'transport/yandex/volga_v6_atomic.go'
      - 'transport/yandex/vyandex_v6_transport.go'
      - 'transport/yandex/vyandex_v6_transport_test.go'
      - 'transport/yandex/vyandex_v6_concurrency_test.go'
      - 'transport/yandex/vyandex_v6_load_test.go'
      - 'transport/yandex/vyandex_v6_raw_transport.go'
      - 'transport/yandex/volga_v6_single_doc_factory.go'
      - '.github/workflows/volga-v6-simulator.yml'

permissions:
  contents: read

jobs:
  raw-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Format V6 source
        run: |
          gofmt -w \
            main.go \
            transport/yandex/volga_v6_reliable.go \
            transport/yandex/volga_v6_reliable_test.go \
            transport/yandex/volga_v6_carrier_manager.go \
            transport/yandex/volga_v6_carrier_manager_test.go \
            transport/yandex/volga_v6_recovery.go \
            transport/yandex/volga_v6_recovery_test.go \
            transport/yandex/volga_v6_wire.go \
            transport/yandex/volga_v6_wire_test.go \
            transport/yandex/volga_v6_runtime.go \
            transport/yandex/volga_v6_runtime_test.go \
            transport/yandex/volga_v6_yandex_carrier.go \
            transport/yandex/volga_v6_yandex_carrier_test.go \
            transport/yandex/volga_v6_yandex_health.go \
            transport/yandex/volga_v6_atomic.go \
            transport/yandex/vyandex_v6_transport.go \
            transport/yandex/vyandex_v6_transport_test.go \
            transport/yandex/vyandex_v6_concurrency_test.go \
            transport/yandex/vyandex_v6_load_test.go \
            transport/yandex/vyandex_v6_raw_transport.go \
            transport/yandex/volga_v6_single_doc_factory.go

      - name: V6 deterministic tests
        run: go test -timeout 2m ./transport/yandex -run '^TestVolgaV6' -count=1 -v

      - name: Compile all packages
        run: go test -timeout 2m -run '^$' ./...

      - name: Build Linux amd64 V6 raw-control binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -trimpath \
            -o dist/openflux-volga-v6-raw .
          HELP="$(./dist/openflux-volga-v6-raw -h 2>&1 || true)"
          grep -q 'vyandex-v6-raw' <<<"${HELP}"
          sha256sum dist/openflux-volga-v6-raw | tee dist/SHA256SUMS
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "go=$(go version)"
            echo "transport=vyandex-v6-raw"
            echo "physical_carrier=v6-yandex-generation-1"
            echo "document_mode=single-document"
            echo "logical_reliability=disabled"
            echo "ack_sack=disabled"
            echo "replay_retry=disabled"
            echo "recovery_handoff=disabled"
            echo "batch=20-packets-5000-bytes-2ms"
            echo "send_workers=32"
          } > dist/BUILD-METADATA.txt

      - name: Upload V6 raw-control artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-volga-v6-raw-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Show formatting diff
        if: always()
        run: |
          git diff -- \
            main.go \
            transport/yandex/vyandex_v6_raw_transport.go \
            transport/yandex/volga_v6_yandex_carrier.go \
            transport/yandex/volga_v6_wire.go || true
