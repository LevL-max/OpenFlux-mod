name: Volga V6 reliability simulator

on:
  workflow_dispatch:
  push:
    branches:
      - design/volga-v6-reliable-carrier-manager
    paths:
      - 'main.go'
      - 'transport/yandex/volga_v6_reliable.go'
      - 'transport/yandex/volga_v6_reliable_test.go'
      - 'transport/yandex/volga_v6_carrier_manager.go'
      - 'transport/yandex/volga_v6_carrier_manager_test.go'
      - 'transport/yandex/volga_v6_recovery.go'
      - 'transport/yandex/volga_v6_recovery_test.go'
      - 'transport/yandex/volga_v6_wire.go'
      - 'transport/yandex/volga_v6_wire_test.go'
      - 'transport/yandex/volga_v6_runtime.go'
      - 'transport/yandex/volga_v6_runtime_test.go'
      - 'transport/yandex/volga_v6_yandex_carrier.go'
      - 'transport/yandex/volga_v6_yandex_carrier_test.go'
      - 'transport/yandex/volga_v6_yandex_health.go'
      - 'transport/yandex/volga_v6_atomic.go'
      - 'transport/yandex/vyandex_v6_transport.go'
      - 'transport/yandex/vyandex_v6_transport_test.go'
      - 'transport/yandex/vyandex_v6_concurrency_test.go'
      - 'transport/yandex/vyandex_v6_load_test.go'
      - 'docs/volga-v6-design.md'
      - 'docs/volga-v6-invariants.md'
      - '.github/workflows/volga-v6-simulator.yml'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Format V6 source
        run: |
          gofmt -w \
            main.go \
            transport/yandex/volga_v6_reliable.go \
            transport/yandex/volga_v6_reliable_test.go \
            transport/yandex/volga_v6_carrier_manager.go \
            transport/yandex/volga_v6_carrier_manager_test.go \
            transport/yandex/volga_v6_recovery.go \
            transport/yandex/volga_v6_recovery_test.go \
            transport/yandex/volga_v6_wire.go \
            transport/yandex/volga_v6_wire_test.go \
            transport/yandex/volga_v6_runtime.go \
            transport/yandex/volga_v6_runtime_test.go \
            transport/yandex/volga_v6_yandex_carrier.go \
            transport/yandex/volga_v6_yandex_carrier_test.go \
            transport/yandex/volga_v6_yandex_health.go \
            transport/yandex/volga_v6_atomic.go \
            transport/yandex/vyandex_v6_transport.go \
            transport/yandex/vyandex_v6_transport_test.go \
            transport/yandex/vyandex_v6_concurrency_test.go \
            transport/yandex/vyandex_v6_load_test.go

      - name: V6 deterministic reliability tests
        run: go test -timeout 2m ./transport/yandex -run '^TestVolgaV6' -count=1 -v

      - name: V6 race check
        run: go test -race -timeout 2m ./transport/yandex -run '^TestVolgaV6' -count=1

      - name: Compile all packages
        run: go test -timeout 2m -run '^$' ./...

      - name: Build Linux amd64 V6 experimental binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -trimpath \
            -o dist/openflux-volga-v6 .
          ./dist/openflux-volga-v6 -h 2>&1 | grep -q 'volga-url-secondary'
          sha256sum dist/openflux-volga-v6 | tee dist/SHA256SUMS
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "go=$(go version)"
            echo "transport=vyandex-v6"
            echo "wire=OFV6REL1"
            echo "logical_reliability=shared-across-physical-generations"
            echo "physical_carrier=recyclable-yandex-auth-session"
            echo "batch=20-packets-5000-bytes-2ms"
            echo "send_workers=32"
            echo "ack=coalesced-repeatable-state"
            echo "recycle=delivery-progress-stall"
            echo "telemetry=enabled-in-debug"
          } > dist/BUILD-METADATA.txt

      - name: Upload V6 experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-volga-v6-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Show formatting diff
        if: always()
        run: |
          git diff -- \
            main.go \
            transport/yandex/volga_v6_reliable.go \
            transport/yandex/volga_v6_reliable_test.go \
            transport/yandex/volga_v6_carrier_manager.go \
            transport/yandex/volga_v6_carrier_manager_test.go \
            transport/yandex/volga_v6_recovery.go \
            transport/yandex/volga_v6_recovery_test.go \
            transport/yandex/volga_v6_wire.go \
            transport/yandex/volga_v6_wire_test.go \
            transport/yandex/volga_v6_runtime.go \
            transport/yandex/volga_v6_runtime_test.go \
            transport/yandex/volga_v6_yandex_carrier.go \
            transport/yandex/volga_v6_yandex_carrier_test.go \
            transport/yandex/volga_v6_yandex_health.go \
            transport/yandex/volga_v6_atomic.go \
            transport/yandex/vyandex_v6_transport.go \
            transport/yandex/vyandex_v6_transport_test.go \
            transport/yandex/vyandex_v6_concurrency_test.go \
            transport/yandex/vyandex_v6_load_test.go || true
