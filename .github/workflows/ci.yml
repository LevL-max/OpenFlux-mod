name: CI

on:
  push:
    branches: [main, integration/canonical-v4-bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Integration tests
        run: |
          python3 -m pip install cryptography
          PYTHONPATH=integration python3 -m unittest discover -s integration/tests -v
          python3 -m compileall -q integration

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/openflux .
          go build -trimpath -o dist/volga-probe ./cmd/volga-probe
          sha256sum dist/openflux dist/volga-probe | tee dist/SHA256SUMS
          printf 'git_commit=%s\n' "$GITHUB_SHA" > dist/BUILD-METADATA
          printf 'go_version=%s\n' "$(go version)" >> dist/BUILD-METADATA

      - name: Volga probe CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./dist/volga-probe >/tmp/volga-probe.out 2>/tmp/volga-probe.err
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq 'Usage: volga-probe <classify|auth|ws>' /tmp/volga-probe.err

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-linux-amd64-${{ github.sha }}
          path: |
            dist/openflux
            dist/volga-probe
            dist/SHA256SUMS
            dist/BUILD-METADATA
          if-no-files-found: error
          retention-days: 30
