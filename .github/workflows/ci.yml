name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test-build:
    if: ${{ hashFiles('go.mod') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -o dist/openflux .
          sha256sum dist/openflux | tee dist/SHA256SUMS
          printf 'git_commit=%s\n' "$GITHUB_SHA" > dist/BUILD-METADATA
          printf 'go_version=%s\n' "$(go version)" >> dist/BUILD-METADATA

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-linux-amd64-${{ github.sha }}
          path: |
            dist/openflux
            dist/SHA256SUMS
            dist/BUILD-METADATA
          if-no-files-found: error
          retention-days: 30
