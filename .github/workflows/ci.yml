name: CI

on:
  push:
    branches: [main, integration/canonical-v4-bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Volga opt-in tests
        run: |
          go test -race -tags volga ./transport/yandex
          go vet -tags volga ./transport/yandex
          cd volga
          go test -race -tags volga ./...
          go vet -tags volga ./...

      - name: Integration tests
        run: |
          python3 -m pip install cryptography
          PYTHONPATH=integration python3 -m unittest discover -s integration/tests -v
          python3 -m compileall -q integration

      - name: Build Linux amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          VERSION="$(tr -d '[:space:]' < release/VERSION)"
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/openflux .
          (cd volga && go build -tags volga -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=$VERSION" -o ../dist/openflux-volga ./cmd/openflux-volga-lab)
          sha256sum dist/openflux dist/openflux-volga | tee dist/SHA256SUMS
          printf 'git_commit=%s\n' "$GITHUB_SHA" > dist/BUILD-METADATA
          printf 'go_version=%s\n' "$(go version)" >> dist/BUILD-METADATA

      - name: Smoke-test separate containers without publishing
        run: |
          cp dist/openflux dist/openflux-linux-amd64
          cp dist/openflux-volga dist/openflux-volga-linux-amd64
          docker build -f Dockerfile.release -t openflux-legacy-ci .
          docker run --rm openflux-legacy-ci --help >/dev/null
          docker build -f Dockerfile.volga -t openflux-volga-ci .
          docker save openflux-volga-ci | gzip > dist/volga-ci-container.tar.gz
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' openflux-volga-ci)"
          docker load --input dist/volga-ci-container.tar.gz
          test "$(docker image inspect --format='{{.Id}}' openflux-volga-ci)" = "$IMAGE_ID"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=256m --cpus=0.5 "$IMAGE_ID" -version

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-linux-amd64-${{ github.sha }}
          path: |
            dist/openflux
            dist/openflux-volga
            dist/SHA256SUMS
            dist/BUILD-METADATA
          if-no-files-found: error
          retention-days: 30
