name: Publish v4.0.0-rc3 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rc3-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish existing draft as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v4.0.0-rc3 \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --title "OpenFlux-mod v4.0.0-rc3" \
            --notes-file release/RC3-NOTES.md

# trigger publication
