name: Volga reliable v5.2

on:
  workflow_dispatch:
  push:
    branches:
      - test/volga-reliable-v5
    paths:
      - 'tools/volga_ordered_batch_v4b.py'
      - 'tools/volga_ordered_batch_v4c.py'
      - 'tools/volga_batch_trace_v4d.py'
      - 'tools/volga_bounded_reorder_v4e.py'
      - 'tools/volga_reliable_v5.py'
      - 'tools/volga_reliable_v5_impl.go.txt'
      - 'tools/volga_reliable_v5_test.go.txt'
      - 'tools/volga_reliable_v5_ci_compat.py'
      - 'tools/volga_reliable_v5_1_congestion.py'
      - 'tools/volga_reliable_v5_2_resume.py'
      - '.github/workflows/volga-reliable-v5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Apply V1 central batcher
        run: python3 tools/volga_central_batcher_v1.py

      - name: Apply V2 telemetry and redaction
        run: python3 tools/volga_central_batcher_v2_telemetry.py

      - name: Apply V3 byte cap
        run: python3 tools/volga_central_batcher_v3_bytecap.py

      - name: Apply V4 packet telemetry
        run: python3 tools/volga_central_batcher_v4_packet_telemetry.py

      - name: Apply V5 serial worker baseline step
        run: python3 tools/volga_central_batcher_v5_serial_worker.py

      - name: Apply V6 64-worker baseline step
        run: python3 tools/volga_central_batcher_v6_64_workers.py

      - name: Apply runtime benchmark harness
        run: python3 tools/volga_benchmark_harness.py

      - name: Apply body fragmentation v1
        run: python3 tools/volga_body_fragment_v1.py

      - name: Apply adaptive fragmentation v2
        run: python3 tools/volga_adaptive_fragment_v2.py

      - name: Apply HTTP shards v3
        run: python3 tools/volga_http_shards_v3.py

      - name: Apply ordered-batch v4b
        run: python3 tools/volga_ordered_batch_v4b.py

      - name: Apply strict ordered receive v4c
        run: python3 tools/volga_ordered_batch_v4c.py

      - name: Apply per-batch forensic trace v4d
        run: python3 tools/volga_batch_trace_v4d.py

      - name: Apply bounded reorder timer v4e
        run: python3 tools/volga_bounded_reorder_v4e.py

      - name: Apply reliable transport v5
        run: python3 tools/volga_reliable_v5.py

      - name: Apply V5.1 congestion control
        run: python3 tools/volga_reliable_v5_1_congestion.py

      - name: Apply V5.2 receiver resume floor
        run: python3 tools/volga_reliable_v5_2_resume.py

      - name: Isolate superseded V4 receive tests
        run: python3 tools/volga_reliable_v5_ci_compat.py

      - name: Format generated Go
        run: |
          gofmt -w \
            main.go \
            transport/transport.go \
            transport/yandex/vyandex.go \
            transport/yandex/volga_fragment_test.go \
            transport/yandex/volga_http_shards_test.go \
            transport/yandex/volga_ordered_batch_v4b_test.go \
            transport/yandex/volga_ordered_batch_v4c_test.go \
            transport/yandex/volga_bounded_reorder_v4e_test.go \
            transport/yandex/volga_reliable_v5.go \
            transport/yandex/volga_reliable_v5_test.go \
            transport/yandex/volga_reliable_v5_1_test.go \
            transport/yandex/volga_reliable_v5_2_test.go

      - name: Test
        run: go test -timeout 2m ./...

      - name: Build linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -trimpath -o openflux-volga-reliable-v5-2 .

      - name: Verify runtime knobs
        run: |
          ./openflux-volga-reliable-v5-2 -h 2>&1 | grep -E -- 'volga-workers|volga-http-shards|volga-batch-bytes|volga-http-body-limit|volga-normalize-mtu' >/dev/null

      - name: Verify V5.2 reliability source
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          vy = Path('transport/yandex/vyandex.go').read_text()
          rel = Path('transport/yandex/volga_reliable_v5.go').read_text()

          checks = {
              'V5.2 live DATA metadata': r'makeVolgaReliableDataMetaV52\s*\(',
              'replay floor sender': r'volgaReliableReplayFloor\s*\(',
              'V5.2 metadata parser': r'parseVolgaReliableDataMetaV52\s*\(',
              'V5.2 receiver baseline': r'volgaReliableHandleDataV52\s*\(',
              'baseline telemetry': r'receiver baseline session=',
          }
          for name, pattern in checks.items():
              if not re.search(pattern, vy + '\n' + rel):
                  raise SystemExit(f'missing V5.2 source invariant: {name}')

          const_checks = {
              'replay cap': r'volgaReliableReplayCap\s*=\s*16384\b',
              'ACK range cap': r'volgaReliableAckMaxRanges\s*=\s*32\b',
              'retry concurrency': r'volgaReliableRetryConcurrency\s*=\s*8\b',
              'fast retry minimum': r'volgaReliableFastRetryMin\s*=\s*180\s*\*\s*time\.Millisecond',
              'fast retry depth': r'volgaReliableFastRetryDepth\s*=\s*3\b',
              'fast retry burst': r'volgaReliableFastRetryBurst\s*=\s*8\b',
              'timeout retry burst': r'volgaReliableTimeoutRetryBurst\s*=\s*8\b',
          }
          for name, pattern in const_checks.items():
              if not re.search(pattern, rel):
                  raise SystemExit(f'missing V5.2 constant invariant: {name}')

          if 'volgaReliableDataMetaV5Bytes' not in rel or '+ 8 + 8 + 8' not in rel:
              raise SystemExit('missing V5.2 replay-floor metadata width')
          PY

      - name: Verify V5 wire isolation from V4 ordered receive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('transport/yandex/vyandex.go').read_text()
          a = s.index('func (w *wsListener) handleRelayMessage')
          b = s.index('func (w *wsListener) deliverOrderedBundle', a)
          live = s[a:b]
          assert 'handleOrderedBundle' not in live
          assert 'handleBundleItem' in live
          PY

      - name: Checksums and metadata
        run: |
          sha256sum openflux-volga-reliable-v5-2 > SHA256SUMS
          {
            echo "source_branch=test/volga-reliable-v5"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "base=v5.1-congestion-controlled-retransmit"
            echo "experiment=v5.2-receiver-resume-replay-floor"
            echo "reliability=payload-session-seq+replay-floor+cumulative-ack+sack-ranges+selective-retransmit+dedupe"
            echo "receiver_resume=sender-replay-floor"
            echo "legacy_v5_metadata_parse=true"
            echo "replay_cap_batches=16384"
            echo "ack_max_ranges=32"
            echo "retry_concurrency=8"
            echo "fast_retry_min_ms=180"
            echo "fast_retry_depth=3"
            echo "fast_retry_burst=8"
            echo "timeout_retry_burst=8"
            echo "retry_backoff_max_ms=4000"
            echo "ack_interval_ms=20"
            echo "initial_rto_ms=350"
            echo "rto_bounds_ms=150..2000"
            echo "global_receive_hol=disabled-for-v5-live-traffic"
            echo "retransmit_yandex_identity=fresh"
            echo "http_shards_default=1"
            echo "batch_bytes_baseline=5000"
            echo "http_body_limit=8000"
            echo "normalizer_expected_runtime=0"
            echo "go_version=$(go version)"
          } > BUILD-METADATA

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-volga-reliable-v5-2-${{ github.sha }}
          path: |
            openflux-volga-reliable-v5-2
            SHA256SUMS
            BUILD-METADATA
          retention-days: 7
