name: Draft release

on:
  push:
    branches: [main]
    paths:
      - release/VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: openflux-private-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CANONICAL_V4_ANCESTOR: 22f29ab94ca2f5aa5b85956053b5c4cab1d1e31e
      PRODUCTION_V4_SHA256: 6f242d3c7ef9184811e58df5893e0ad0095da6aeb7354ba02df5da99fa569715

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release/VERSION)"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$VERSION" != *-rc* ]]; then
            echo "Only prereleases may be built from a non-main branch." >&2
            exit 1
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test exact release source
        run: |
          go test -race ./...
          go vet ./...
          go test -race -tags volga ./transport/yandex
          (cd volga && go test -race -tags volga ./... && go vet -tags volga ./...)

      - name: Test and package integration
        run: |
          python3 -m pip install cryptography
          PYTHONPATH=integration python3 -m unittest discover -s integration/tests -v
          python3 -m compileall -q integration
          mkdir -p dist
          tar -czf dist/openflux-integration-linux.tar.gz integration/{openflux_release.py,openflux_auth.py,cookie_import.py,recovery_crypto.py,recovery_inbox.py,router_integration.py,install.py,README.md}
          install -m 0755 integration/openflux_node.py dist/openflux-node.py

      - name: Build Linux amd64 release binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags='-s -w -buildid=' -o dist/openflux-linux-amd64 .
          (cd volga && go build -tags volga -buildvcs=false -trimpath -ldflags="-s -w -buildid= -X main.version=$VERSION" -o ../dist/openflux-volga-linux-amd64 ./cmd/openflux-volga-lab)
          install -m 0755 scripts/openflux-yandex-cookie-import dist/openflux-yandex-cookie-import
          python3 dist/openflux-yandex-cookie-import --help >/dev/null

      - name: Build and smoke-test runtime container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build \
            --file Dockerfile.release \
            --build-arg VERSION="$VERSION" \
            --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
            --tag "$IMAGE:$VERSION" \
            .
          docker run --rm "$IMAGE:$VERSION" --help >/tmp/openflux-help.txt 2>&1
          test -s /tmp/openflux-help.txt
          docker save "$IMAGE:$VERSION" | gzip -9 > dist/openflux-container-linux-amd64.tar.gz

      - name: Build and smoke-test isolated Volga container
        run: |
          set -euo pipefail
          VOLGA_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-volga"
          echo "VOLGA_IMAGE=$VOLGA_IMAGE" >> "$GITHUB_ENV"
          docker build --file Dockerfile.volga --build-arg VERSION="$VERSION" --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" --tag "$VOLGA_IMAGE:$VERSION" .
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --memory=256m --cpus=0.5 "$VOLGA_IMAGE:$VERSION" -version
          docker save "$VOLGA_IMAGE:$VERSION" | gzip -9 > dist/openflux-volga-container-linux-amd64.tar.gz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable container tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-$SOURCE_COMMIT"
          docker push "$IMAGE:sha-$SOURCE_COMMIT"
          docker push "$VOLGA_IMAGE:$VERSION"
          docker tag "$VOLGA_IMAGE:$VERSION" "$VOLGA_IMAGE:sha-$SOURCE_COMMIT"
          docker push "$VOLGA_IMAGE:sha-$SOURCE_COMMIT"
          REGISTRY_DIGEST="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$REGISTRY_DIGEST"
          echo "REGISTRY_DIGEST=$REGISTRY_DIGEST" >> "$GITHUB_ENV"
          VOLGA_REGISTRY_DIGEST="$(docker buildx imagetools inspect "$VOLGA_IMAGE:$VERSION" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$VOLGA_REGISTRY_DIGEST"
          echo "VOLGA_REGISTRY_DIGEST=$VOLGA_REGISTRY_DIGEST" >> "$GITHUB_ENV"

      - name: Write immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          BINARY_SHA="$(sha256sum dist/openflux-linux-amd64 | awk '{print $1}')"
          HELPER_SHA="$(sha256sum dist/openflux-yandex-cookie-import | awk '{print $1}')"
          IMAGE_ARCHIVE_SHA="$(sha256sum dist/openflux-container-linux-amd64.tar.gz | awk '{print $1}')"
          VOLGA_SHA="$(sha256sum dist/openflux-volga-linux-amd64 | awk '{print $1}')"
          VOLGA_IMAGE_ID="$(docker image inspect --format='{{.Id}}' "$VOLGA_IMAGE:$VERSION")"
          python3 release/protocol_manifest.py dist "$VERSION" "$SOURCE_COMMIT" "$VOLGA_IMAGE@$VOLGA_REGISTRY_DIGEST" "$VOLGA_IMAGE_ID"
          cat > dist/BUILD-METADATA <<EOF
          version=$VERSION
          source_commit=$SOURCE_COMMIT
          canonical_v4_ancestor=$CANONICAL_V4_ANCESTOR
          historical_production_binary_sha256=$PRODUCTION_V4_SHA256
          go_version=$(go version)
          goos=linux
          goarch=amd64
          cgo_enabled=0
          go_build_flags=-trimpath -ldflags=-s -w -buildid=
          binary_sha256=$BINARY_SHA
          yandex_cookie_import_helper_sha256=$HELPER_SHA
          container_archive_sha256=$IMAGE_ARCHIVE_SHA
          container_registry=$IMAGE:$VERSION
          container_registry_digest=$REGISTRY_DIGEST
          container_base=debian:bookworm-slim
          volga_binary_sha256=$VOLGA_SHA
          volga_registry_digest=$VOLGA_REGISTRY_DIGEST
          volga_lab_base=c630641933c19fdf250c9c13ffaef6fee6e80be3
          production_deployed=false
          EOF

          cat > dist/RELEASE-NOTES.md <<EOF
          # OpenFlux-mod $VERSION

          Experimental Mail.ru hybrid: document chat carries connection setup, TCP acknowledgements and the first 4 KiB per flow; four Cloud file lanes carry bulk packets.

          Both Mail.ru peers must update together. Existing browser profiles are reused and hot-reloaded. A private document-specific Cloud folder is created automatically; no public file links are created.

          File notifications are retried, hashes verified and acknowledged files removed. File requests, queues and object lifetime are bounded. Dedicated stale protocol files are swept after an hour.

          This prerelease changes the generated Mail.ru service profile. Legacy and Volga transport code is unchanged. Installing it does not select Mail.ru or switch router mode. Production clients on stable should remain on v4.2.6.

          This is a test candidate, not a claim of production browser stability. Validate actual routed browsing and recovery on test nodes before promoting it.

          Source commit: $SOURCE_COMMIT
          EOF

          sha256sum \
            dist/openflux-linux-amd64 \
            dist/openflux-volga-linux-amd64 \
            dist/openflux-volga-container-linux-amd64.tar.gz \
            dist/protocol-manifest.json \
            dist/openflux-yandex-cookie-import \
            dist/openflux-integration-linux.tar.gz \
            dist/openflux-node.py \
            dist/openflux-container-linux-amd64.tar.gz \
            dist/BUILD-METADATA \
            dist/RELEASE-NOTES.md \
            > dist/SHA256SUMS
          sed -i 's|  dist/|  |' dist/SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-rc* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" \
            dist/openflux-linux-amd64 \
            dist/openflux-volga-linux-amd64 \
            dist/openflux-volga-container-linux-amd64.tar.gz \
            dist/protocol-manifest.json \
            dist/openflux-yandex-cookie-import \
            dist/openflux-integration-linux.tar.gz \
            dist/openflux-node.py \
            dist/openflux-container-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            dist/BUILD-METADATA \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "OpenFlux-mod $VERSION" \
            --draft \
            "${prerelease[@]}" \
            --notes-file dist/RELEASE-NOTES.md
