name: Volga body-aware fragmentation v1

on:
  workflow_dispatch:
  push:
    branches:
      - test/volga-body-fragment-v1
    paths:
      - 'tools/volga_body_fragment_v1.py'
      - '.github/workflows/volga-body-fragment-v1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Apply V1 central batcher
        run: python3 tools/volga_central_batcher_v1.py

      - name: Apply V2 telemetry and redaction
        run: python3 tools/volga_central_batcher_v2_telemetry.py

      - name: Apply V3 byte cap
        run: python3 tools/volga_central_batcher_v3_bytecap.py

      - name: Apply V4 packet telemetry
        run: python3 tools/volga_central_batcher_v4_packet_telemetry.py

      - name: Apply V5 serial worker baseline step
        run: python3 tools/volga_central_batcher_v5_serial_worker.py

      - name: Apply V6 64-worker baseline step
        run: python3 tools/volga_central_batcher_v6_64_workers.py

      - name: Apply runtime benchmark harness
        run: python3 tools/volga_benchmark_harness.py

      - name: Apply body-aware fragmentation
        run: python3 tools/volga_body_fragment_v1.py

      - name: Format generated Go
        run: gofmt -w main.go transport/transport.go transport/yandex/vyandex.go transport/yandex/volga_fragment_test.go

      - name: Test
        run: go test ./...

      - name: Build linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o openflux-volga-body-fragment-v1 .

      - name: Verify runtime knobs
        run: |
          ./openflux-volga-body-fragment-v1 --help 2>&1 | grep -E -- '--volga-workers|--volga-batch-bytes|--volga-http-body-limit|--volga-normalize-mtu'

      - name: Checksums and metadata
        run: |
          sha256sum openflux-volga-body-fragment-v1 > SHA256SUMS
          {
            echo "source_branch=test/volga-body-fragment-v1"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "transform=v1-v6+benchmark-harness+body-fragment-v1"
            echo "safe_http_body_default=8000"
            echo "normalizer_expected_runtime=0"
            echo "go_version=$(go version)"
          } > BUILD-METADATA

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openflux-volga-body-fragment-v1-${{ github.sha }}
          path: |
            openflux-volga-body-fragment-v1
            SHA256SUMS
            BUILD-METADATA
          retention-days: 7
